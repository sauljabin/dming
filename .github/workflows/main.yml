name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.7"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Analyze
        run: uv run --locked python -m scripts.analyze

  unit-tests:
    name: Unit / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run --locked python -m scripts.tests

  build:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync dependencies
        run: uv sync --locked
      - name: Build distributions
        run: uv build --clear
      - name: Verify distributions
        run: |
          package_version=$(uv run --locked python -c 'from dming import __version__; print(__version__)')
          uv run --locked python -m scripts.verify_release "$package_version" dist
      - name: Install and smoke-test wheel
        run: |
          uv venv "$RUNNER_TEMP/package-venv" --python 3.13
          uv pip install --python "$RUNNER_TEMP/package-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/package-venv/bin/dming" --help
          "$RUNNER_TEMP/package-venv/bin/dming" rules advancement --format json
          "$RUNNER_TEMP/package-venv/bin/dming" convert feet 5 --format csv
          "$RUNNER_TEMP/package-venv/bin/roll" d1 --format csv

  result:
    name: CI result
    if: always()
    needs: [quality, unit-tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$BUILD_RESULT" = success
